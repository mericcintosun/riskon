name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Least-privilege by default; jobs opt into more if needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Public testnet configuration needed for the Next.js build (no secrets).
  NEXT_PUBLIC_RPC_URL: "https://soroban-testnet.stellar.org"
  NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
  NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  NEXT_PUBLIC_RISK_TIER_CONTRACT_ID: "CCGZV37C3FC2GLVNIHFEC6OVDHRFLQCELPTQLII44Z7RXZBEER5POPRO"
  NEXT_PUBLIC_RISK_SCORE_CONTRACT_ID: "CCGZV37C3FC2GLVNIHFEC6OVDHRFLQCELPTQLII44Z7RXZBEER5POPRO"
  NEXT_PUBLIC_FACTORY_CONTRACT_ID: "CAUNV4HDBL2R25IVNMMR25F7B4IWY46N5HXX6K32QOXTGEUKOW5UBZBW"
  NEXT_PUBLIC_WALLET_WASM_HASH: "fdefad64b96837147e1c333e51f537b696eab925e9f147e63d597c04e3c903f0"
  NEXT_PUBLIC_PASSKEY_ENABLED: "true"
  NEXT_PUBLIC_WEBAUTHN_ORIGIN: "http://localhost:3000"

jobs:
  # ── Frontend: lint, test, build ────────────────────────────────────────────
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Jest)
        run: npm test -- --ci --coverage --passWithNoTests

      - name: Build (Next.js)
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  # ── Smart contract: fmt, clippy, test, build wasm ──────────────────────────
  contract:
    name: Smart Contract (Soroban / Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk_score
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # soroban-sdk 27 requires the wasm32v1-none target.
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            risk_score/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('risk_score/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        # Deny warnings, but allow the known soroban events() deprecation
        # (tracked for migration to #[contractevent]).
        run: cargo clippy --target wasm32v1-none -- -D warnings -A deprecated

      - name: Unit tests
        run: cargo test

      - name: Build release wasm
        run: cargo build --target wasm32v1-none --release

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: risk-score-wasm
          path: risk_score/target/wasm32v1-none/release/*.wasm
          retention-days: 7

  # ── Backend: install + module smoke test ───────────────────────────────────
  backend:
    name: Backend (liquidity monitor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (module loads + express route responds)
        run: |
          node -e '
            const { app } = require("./liquidityMonitor.js");
            const server = app.listen(0, async () => {
              const port = server.address().port;
              const res = await fetch(`http://localhost:${port}/`);
              if (res.status !== 200) { console.error("bad status", res.status); process.exit(1); }
              const body = await res.json();
              if (!body.status) { console.error("no status field"); process.exit(1); }
              console.log("backend smoke OK:", body.status);
              server.close(); process.exit(0);
            });
          '

  # ── Aggregate gate ─────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [frontend, contract, backend]
    steps:
      - run: echo "All CI jobs passed ✅"
