name: Automated Deployment

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
    types: [closed]
  release:
    types: [ published ]

env:
  NODE_VERSION: '22'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Deploy to Staging (dev branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test -- --passWithNoTests
        
      - name: Build application
        run: npm run build
        
      - name: Deploy to Vercel Staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: '--preview'
          working-directory: ./
          
      - name: Deploy smart contract to Testnet
        run: |
          cd risk_score
          cargo install soroban-cli --version 24.0.0 --locked
          soroban contract deploy \
            --wasm target/wasm32-unknown-unknown/release/risk_score.wasm \
            --network testnet \
            --source ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        env:
          STELLAR_TESTNET_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        continue-on-error: true

  # Deploy to Production (main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run full test suite
        run: |
          npm test -- --coverage
          npm run test:integration || echo "Integration tests not yet implemented"
          
      - name: Build application
        run: npm run build
        
      - name: Run security audit
        run: npm audit --audit-level=moderate
        
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
          
      - name: Deploy smart contract to Mainnet
        run: |
          cd risk_score
          cargo install soroban-cli --version 24.0.0 --locked
          soroban contract deploy \
            --wasm target/wasm32-unknown-unknown/release/risk_score.wasm \
            --network mainnet \
            --source ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        env:
          STELLAR_MAINNET_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        continue-on-error: true

  # Deploy on Release
  deploy-release:
    name: Deploy Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run comprehensive tests
        run: |
          npm test -- --coverage
          npm run test:integration || echo "Integration tests not yet implemented"
          npm run lint
          
      - name: Build application
        run: npm run build
        
      - name: Create release assets
        run: |
          mkdir -p release-assets
          
          # Build smart contract
          cd risk_score
          cargo build --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/risk_score.wasm ../release-assets/
          cd ..
          
          # Create archive
          cd release-assets
          tar -czf riskon-v${{ github.event.release.tag_name }}.tar.gz *.wasm
          zip riskon-v${{ github.event.release.tag_name }}.zip *.wasm
          
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release-assets/riskon-v${{ github.event.release.tag_name }}.tar.gz
          asset_name: riskon-v${{ github.event.release.tag_name }}.tar.gz
          asset_content_type: application/gzip
          
      - name: Upload additional release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release-assets/riskon-v${{ github.event.release.tag_name }}.zip
          asset_name: riskon-v${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip
          
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
          
      - name: Update deployment status
        run: |
          echo "🚀 Release ${{ github.event.release.tag_name }} deployed successfully!"
          echo "📦 Assets uploaded to GitHub release"
          echo "🌐 Application deployed to production"

  # Rollback deployment
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [deploy-production, deploy-staging]
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get previous successful deployment
        id: previous_deployment
        run: |
          # Get the previous successful commit
          PREVIOUS_COMMIT=$(git log --oneline -n 10 --skip=1 | head -n 1 | awk '{print $1}')
          echo "commit=$PREVIOUS_COMMIT" >> $GITHUB_OUTPUT
          echo "Previous successful commit: $PREVIOUS_COMMIT"
          
      - name: Rollback to previous commit
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
          
      - name: Notify rollback
        run: |
          echo "🔄 Deployment rolled back to commit ${{ steps.previous_deployment.outputs.commit }}"
          echo "📧 Please investigate the deployment failure"

  # Health check after deployment
  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success')
    
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Check application health
        run: |
          # Check if the application is responding
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            URL="https://riskon.vercel.app"
          else
            URL="https://riskon-git-dev-omolobamoyinoluwa-max.vercel.app"
          fi
          
          # Perform health check
          response=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed - Application is responding (HTTP $response)"
          else
            echo "❌ Health check failed - Application not responding (HTTP $response)"
            exit 1
          fi
          
      - name: Check critical endpoints
        run: |
          # Check critical application endpoints
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            BASE_URL="https://riskon.vercel.app"
          else
            BASE_URL="https://riskon-git-dev-omolobamoyinoluwa-max.vercel.app"
          fi
          
          # Check main page
          curl -f -s "$BASE_URL" > /dev/null || echo "Main page check failed"
          
          # Check API endpoints if they exist
          curl -f -s "$BASE_URL/api/health" > /dev/null || echo "API health check not available"
          
          echo "🔍 Endpoint checks completed"
          
      - name: Run smoke tests
        run: |
          # Basic smoke tests to ensure critical functionality works
          echo "🧪 Running smoke tests..."
          
          # Test basic page load
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            curl -s "https://riskon.vercel.app" | grep -q "riskon" || echo "Brand check failed"
          else
            curl -s "https://riskon-git-dev-omolobamoyinoluwa-max.vercel.app" | grep -q "riskon" || echo "Brand check failed"
          fi
          
          echo "✅ Smoke tests completed"
